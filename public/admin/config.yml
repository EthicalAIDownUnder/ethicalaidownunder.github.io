backend:
  name: github
  repo: EthicalAIDownUnder/ethicalaidownunder.github.io
  branch: main
  # For non-Netlify hosting, live login needs an OAuth service.
  # base_url: https://your-oauth-service.example.com

local_backend: true
publish_mode: editorial_workflow

media_folder: "public/uploads"
public_folder: "/ethicalaidownunder/uploads"

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} - {{pubDate}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime" }
      - { label: "Updated Date", name: "updatedDate", widget: "datetime", required: false }
      - { label: "Author", name: "author", widget: "string", default: "Ethical AI Down Under" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "events"
    label: "Events"
    folder: "src/content/events"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} - {{date}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "End Date", name: "endDate", widget: "datetime", required: false }
      - { label: "Time", name: "time", widget: "string", required: false }
      - { label: "Location", name: "location", widget: "string", default: "Online / Adelaide" }
      - { label: "Type", name: "type", widget: "select", options: ["Workshop", "Webinar", "Meetup", "Panel", "Roundtable", "Conference"] }
      - { label: "Status", name: "status", widget: "select", options: ["planned", "open", "sold-out", "past"], default: "planned" }
      - { label: "Registration URL", name: "registrationUrl", widget: "string", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "resources"
    label: "Resources"
    folder: "src/content/resources"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} - {{resourceType}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime" }
      - { label: "Resource Type", name: "resourceType", widget: "select", options: ["Guide", "Briefing", "Toolkit", "Report", "Submission", "Template", "Explainer"] }
      - { label: "Download URL", name: "downloadUrl", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }
